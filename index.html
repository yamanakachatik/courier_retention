<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Courier Lifecycle & Retention Decision Engine</title>
  <!-- Shared cloud build v8 -->
  <style>

:root{
  --bg-page:#FAFAF8;
  --bg-surface:#FFFFFF;
  --text-primary:#202020;
  --text-secondary:#666666;
  --border-subtle:#E3E3DE;
  --accent-red:#B9534B;
  --accent-green:#315C4C;
  --risk-low-bg:#EAF4EC;
  --risk-low-border:#CFE2D3;
  --risk-low-text:#3F6B4C;
  --risk-medium-bg:#FFF5D9;
  --risk-medium-border:#EADDAF;
  --risk-medium-text:#806A2A;
  --risk-high-bg:#FBE9E7;
  --risk-high-border:#E8C8C3;
  --risk-high-text:#8A4A42;
  --shadow:0 10px 30px rgba(20,20,20,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg-page);color:var(--text-primary);font-family:Inter,Arial,Helvetica,sans-serif}
body{min-height:100vh}
button,input,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}

.shell{max-width:1500px;margin:0 auto;padding:28px 36px 48px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:28px}
.brand{font-weight:800;letter-spacing:-.02em}
.top-actions{display:flex;gap:10px;align-items:center}
.btn{border:1px solid var(--border-subtle);background:var(--bg-surface);padding:10px 14px;border-radius:10px;color:var(--text-primary)}
.btn:hover{box-shadow:var(--shadow)}
.btn.primary{background:#202020;color:#fff;border-color:#202020}
.btn.danger{color:#8A3C35}
.btn.ghost{background:transparent}
.status{font-size:13px;color:var(--text-secondary)}

.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#7B7B75;margin-bottom:8px}
h1{font-size:34px;line-height:1.1;margin:0 0 12px;letter-spacing:-.03em}
.subtitle{color:var(--text-secondary);max-width:900px;line-height:1.5;margin-bottom:24px}
.breadcrumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:#72726D;margin:2px 0 22px}
.crumb{cursor:pointer}
.crumb:hover{color:#111}
.crumb-sep{color:#B8B8B1}

.searchbar{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border-subtle);border-radius:12px;padding:10px 12px;min-width:320px}
.searchbar input{border:none;outline:none;width:100%;background:transparent}
.search-results{position:absolute;right:36px;top:76px;width:520px;background:#fff;border:1px solid var(--border-subtle);border-radius:14px;box-shadow:var(--shadow);z-index:30;overflow:hidden}
.search-item{padding:12px 14px;border-bottom:1px solid #F0F0EC;cursor:pointer}
.search-item:last-child{border-bottom:none}
.search-item:hover{background:#FAFAF7}
.search-path{font-size:12px;color:#8A8A83;margin-top:4px}

.funnel-layout{display:grid;grid-template-columns:minmax(520px, 680px) 1fr;gap:46px;align-items:start}
.funnel-wrap{position:relative;padding:10px 24px 22px}
.funnel-segment{
  position:relative;
  margin:0 auto 10px;
  min-height:88px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:#F2F2EF;
  border:1px solid #E5E5DF;
  box-shadow:0 6px 16px rgba(20,20,20,.04);
  transition:.18s ease;
  clip-path:polygon(7% 0,93% 0,100% 100%,0 100%);
}
.funnel-segment:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.funnel-segment.active-accent{background:#FFFDFC;border:2px solid var(--accent-red)}
.funnel-title{font-size:22px;font-weight:800;letter-spacing:-.02em}
.funnel-sub{font-size:14px;color:#6F6F69;margin-top:6px}
.badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;background:var(--accent-green);color:#fff;font-size:11px;font-weight:800;margin-top:8px}

.agent-stack{display:flex;flex-direction:column;gap:12px;padding-top:10px}
.agent-card{background:#fff;border:1px solid var(--border-subtle);border-radius:14px;padding:16px 18px;box-shadow:0 4px 16px rgba(20,20,20,.035)}
.agent-label{font-size:12px;font-weight:800;letter-spacing:.04em;color:#555}
.agent-desc{font-size:14px;line-height:1.5;color:#62625D;margin-top:8px}
.agent-placeholder{height:88px}
.strategy{margin-top:24px;background:#F7F1EA;border:1px solid #E7D9CB;border-radius:14px;padding:16px 18px;line-height:1.55}
.strategy strong{display:block;margin-bottom:4px}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.category-card{background:#fff;border:1px solid var(--border-subtle);border-radius:14px;padding:18px;min-height:145px;transition:.18s ease;position:relative}
.category-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#D4D4CC}
.category-title{font-size:18px;font-weight:800;letter-spacing:-.015em;margin-bottom:8px}
.category-desc{font-size:14px;line-height:1.45;color:#666}
.category-meta{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:12px;color:#898981}
.tag{padding:4px 7px;border-radius:999px;background:#F3F3EF;color:#666}

.matrix{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--border-subtle);border-radius:14px;overflow:hidden}
.matrix th,.matrix td{padding:14px 15px;border-right:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle);vertical-align:top}
.matrix th:last-child,.matrix td:last-child{border-right:none}
.matrix tr:last-child td{border-bottom:none}
.matrix th{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:#666;background:#FAFAF7;text-align:left}
.matrix th.low,.matrix td.low{background:var(--risk-low-bg);border-color:var(--risk-low-border)}
.matrix th.medium,.matrix td.medium{background:var(--risk-medium-bg);border-color:var(--risk-medium-border)}
.matrix th.high,.matrix td.high{background:var(--risk-high-bg);border-color:var(--risk-high-border)}
.matrix th.low{color:var(--risk-low-text)}
.matrix th.medium{color:var(--risk-medium-text)}
.matrix th.high{color:var(--risk-high-text)}
.problem-name{font-weight:800;min-width:200px}
.solution-cell{line-height:1.5;cursor:pointer}
.solution-cell:hover{outline:2px solid rgba(0,0,0,.05);outline-offset:-2px}
textarea,input.editable{width:100%;border:1px solid #D8D8D1;border-radius:8px;padding:9px;background:#fff;outline:none}
textarea{min-height:92px;resize:vertical}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}
.filter-chip{border:1px solid var(--border-subtle);background:#fff;padding:8px 10px;border-radius:999px;font-size:13px}
.filter-chip.active{background:#222;color:#fff;border-color:#222}

.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.16);z-index:40}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(560px,90vw);background:#fff;z-index:50;box-shadow:-20px 0 40px rgba(0,0,0,.12);padding:28px;overflow:auto}
.drawer h2{margin-top:0}
.drawer-section{margin:22px 0}
.drawer-section h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#777;margin:0 0 8px}
.drawer ul{padding-left:20px;line-height:1.6}

.edit-row-actions{display:flex;gap:6px;margin-top:10px}
.inline-add{margin:16px 0}
.notice{background:#F3F3EF;border:1px solid var(--border-subtle);padding:12px 14px;border-radius:10px;color:#666}
.empty{border:1px dashed #CBCBC4;border-radius:14px;padding:36px;text-align:center;color:#777}

@media (max-width:1100px){
  .funnel-layout{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .searchbar{min-width:220px}
}
@media (max-width:720px){
  .shell{padding:18px}
  .topbar{align-items:flex-start;flex-direction:column}
  .grid{grid-template-columns:1fr}
  .funnel-wrap{padding:8px 0}
  .matrix-wrap{overflow-x:auto}
  .matrix{min-width:980px}
  .search-results{left:18px;right:18px;top:130px;width:auto}
}


.drag-handle{
  display:inline-flex;align-items:center;justify-content:center;
  width:28px;height:28px;border:1px solid var(--border-subtle);
  border-radius:8px;background:#fff;color:#777;margin-right:8px;
  cursor:grab;user-select:none;vertical-align:middle
}
.drag-handle:active{cursor:grabbing}
.dragging{opacity:.45}
.drop-target{outline:2px dashed #A7A79E;outline-offset:-3px}
.transport-filter-wrap{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin:4px 0 18px;padding:12px 14px;background:#fff;
  border:1px solid var(--border-subtle);border-radius:12px
}
.transport-filter-label{
  font-size:12px;font-weight:800;text-transform:uppercase;
  letter-spacing:.05em;color:#74746E;margin-right:4px
}
.transport-chip{
  border:1px solid var(--border-subtle);background:#FAFAF7;
  padding:8px 11px;border-radius:999px;font-size:13px
}
.transport-chip.active{
  background:#315C4C;color:#fff;border-color:#315C4C
}
.transport-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.transport-tag{
  font-size:11px;padding:4px 7px;border-radius:999px;
  background:#F1F1ED;color:#666;border:1px solid #E2E2DC
}
.category-card[draggable="true"]{cursor:grab}
.category-card.dragging{cursor:grabbing}


.data-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.file-input{display:none}
.sync-note{font-size:12px;color:#777}

.cloud-panel{
  position:fixed;inset:0;background:rgba(0,0,0,.20);z-index:80;
  display:flex;align-items:center;justify-content:center;padding:24px
}
.cloud-card{
  width:min(640px,95vw);background:#fff;border:1px solid var(--border-subtle);
  border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.16);padding:24px
}
.cloud-card h2{margin:0 0 8px}
.cloud-card p{color:#666;line-height:1.5}
.cloud-card label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#777;margin:14px 0 6px}
.cloud-card input{width:100%;border:1px solid var(--border-subtle);border-radius:9px;padding:10px}
.cloud-status{font-size:12px;color:#666}
.reorder-cell{display:flex;align-items:center;gap:8px}
.row-order-controls{display:flex;flex-direction:column;gap:4px}
.order-btn{width:28px;height:24px;border:1px solid var(--border-subtle);background:#fff;border-radius:7px;padding:0}
.order-btn:hover{background:#F5F5F1}
</style>


</head>
<body>
  <div id="app"></div>
  <script>

const DEMO = {"stages":[{"id":"reach","name":"Охват","subtitle":"# лидов","agentName":"","description":"","badge":"","order":1,"categories":[]},{"id":"acquisition","name":"Привлечение","subtitle":"Лид → вход в Про","agentName":"АГЕНТ ПРИВЛЕЧЕНИЯ","description":"Стимулирует перейти к регистрации через разные каналы, отвечает на вопросы лидов","badge":"","order":2,"categories":[]},{"id":"registration","name":"Регистрация","subtitle":"Вход → первый слот","agentName":"АГЕНТ РЕГИСТРАЦИИ","description":"Проводит через регистрацию и закрывает любые вопросы и затыки на этом этапе. Протестируем вместе с наймом, если увидим потенциал после оценки","badge":"","order":3,"categories":[]},{"id":"activation","name":"Активация","subtitle":"Слот → N-й заказ","agentName":"АГЕНТ АКТИВАЦИИ","description":"Сопровождает до N-го заказа: первый слот, вопросы на слоте, онбординг, подсказки по увеличению дохода. Простановка слотов","badge":"MVP","order":4,"categories":[]},{"id":"retention","name":"Удержание","subtitle":"W0 → W4 · SH","agentName":"АГЕНТ ПРЕДИКТИВНОГО ЧЕРНА","description":"PRE-MVP: SH-триггер → проактив → подбор слота. Целевой сценарий: бронь в бэкенде; промокоды, рейтинг, субсидии, минималки; ОС в свободной форме вместо опросов","badge":"PRE-MVP","order":5,"categories":[{"id":"economics","name":"Экономика и вознаграждение","description":"Доход, MPH, коэффициенты, гарантии и экономика работы.","group":"Economic","order":1,"problems":[{"id":"mph-drop","name":"Падение MPH","description":"Почасовой заработок снизился относительно личного бенчмарка.","lowSolution":"Объяснить факторы изменения MPH и подсказать более подходящие часы / зоны.","mediumSolution":"Персонально подобрать 2–3 окна или зоны с лучшей ожидаемой экономикой.","highSolution":"Сначала устранить root cause; затем, если backend вернул eligibility, показать approved guarantee / reactivation bonus / зональную доплату.","notes":"High risk не означает автоматический бонус.","order":1},{"id":"weekly-income","name":"Низкий суммарный доход","description":"Даже при нормальном MPH итоговый заработок за неделю низкий.","lowSolution":"Показать, какие доступные окна могут увеличить число часов без обещания дохода.","mediumSolution":"Собрать персональный недельный план из удобных окон.","highSolution":"Если курьер готов работать больше и экономика положительная — показать eligible guarantee / return bonus.","order":2},{"id":"unpredictable-income","name":"Непредсказуемый доход","description":"Высокая вариативность снижает желание планировать смены.","lowSolution":"Объяснить структуру заработка и управляемые факторы.","mediumSolution":"Предложить более стабильные по истории окна и зоны.","highSolution":"При наличии механики — показать approved guaranteed minimum на ограниченный период.","order":3},{"id":"coefficients","name":"Непонимание коэффициентов / минимумов / доплат","description":"Курьер не понимает, как формируется экономика смены.","lowSolution":"Коротко объяснить механику на конкретном примере.","mediumSolution":"Сравнить 2–3 доступных варианта смены по экономике.","highSolution":"Если риск ухода сохраняется — показать eligible offer с прозрачными условиями и сроком действия.","order":4},{"id":"paid-less","name":"Получил меньше, чем ожидал","description":"","lowSolution":"Показать расшифровку начислений и условий конкретной смены.","mediumSolution":"Сверить факт с правилами кампаний/заказов и подсветить расхождение.","highSolution":"При подтверждённой ошибке — financial support / approved compensation по policy.","order":5},{"id":"payment-missing","name":"Не получил выплату","description":"","lowSolution":"Показать статус выплаты и ожидаемый срок, если доступен.","mediumSolution":"Собрать контекст выплаты и передать в financial support без повторного опроса.","highSolution":"При подтверждённой задержке/ошибке — приоритетная финансовая эскалация.","order":6},{"id":"payment-frequency","name":"Не устраивает частота выплат","description":"","lowSolution":"Объяснить действующий график и доступные варианты получения средств.","mediumSolution":"Если есть альтернативный approved способ — предложить его.","highSolution":"Не компенсировать бонусом: решать через доступный payout-flow.","order":7},{"id":"future-income","name":"Непонятно, сколько заработает на следующем выходе","description":"","lowSolution":"Показать доступные коэффициенты, минималки и факторы без обещания фактического дохода.","mediumSolution":"Сравнить несколько вариантов слота/зоны по ожидаемой экономике.","highSolution":"Если uncertainty — ключевой blocker, использовать только approved guarantee с прозрачными условиями.","order":8},{"id":"bonus-low","name":"Мало бонусов","description":"","lowSolution":"Показать доступные кампании и условия eligibility.","mediumSolution":"Подобрать релевантную кампанию под доступное время/зону.","highSolution":"High churn сам по себе не даёт право на бонус: показывать только backend-approved offer.","order":9},{"id":"bonus-none","name":"Нет доступных бонусов","description":"","lowSolution":"Объяснить, почему конкретная механика недоступна.","mediumSolution":"Проверить другие бесплатные/операционные способы улучшить опыт.","highSolution":"Денежную механику использовать только если она реально разрешена и экономически оправдана.","order":10},{"id":"tips","name":"Мало / нет чаевых","description":"","lowSolution":"Не обещать чаевые; объяснить, что они не гарантированы.","mediumSolution":"Дать только валидные рекомендации по сервису, если они есть.","highSolution":"Не использовать денежную компенсацию как замену чаевых.","order":11},{"id":"deduction","name":"Штраф / удержание / спорное списание","description":"","lowSolution":"Показать причину и правило простым языком.","mediumSolution":"Дать понятный appeal-flow и собрать контекст.","highSolution":"При спорной ситуации — human/financial escalation; не выдавать компенсацию без решения backend.","order":12}]},{"id":"slots","name":"Слоты и планирование смен (ок)","description":"Проблемы курьера, из-за которы let cloudPollTimer = null;


function loadCloudConfig(){
  const DEFAULT_CLOUD_CONFIG = {
    url: "https://ttysxczuhgbhpgfdijdo.supabase.co",
    anonKey: "sb_publishable_cQZg75ilaWlOuPMluQJM9Q_w9cXefwC",
    workspaceId: "predictive-churn-yamanaka"
  };
  try{
    const raw=localStorage.getItem('courierRetentionCloudConfig');
    if(raw){
      const saved=JSON.parse(raw);
      // Keep the shared workspace fixed for this published site.
      if(saved?.url === DEFAULT_CLOUD_CONFIG.url && saved?.workspaceId === DEFAULT_CLOUD_CONFIG.workspaceId) return saved;
    }
    localStorage.setItem('courierRetentionCloudConfig', JSON.stringify(DEFAULT_CLOUD_CONFIG));
    return DEFAULT_CLOUD_CONFIG;
  }catch(e){
    return DEFAULT_CLOUD_CONFIG;
  }
}
function saveCloudConfig(cfg){
  cloudConfig=cfg;
  localStorage.setItem('courierRetentionCloudConfig',JSON.stringify(cfg));
}
function cloudHeaders(){
  return {
    'apikey': cloudConfig.anonKey,
    'Authorization': 'Bearer '+cloudConfig.anonKey,
    'Content-Type':'application/json',
    'Prefer':'return=representation'
  };
}
function cloudBase(){
  return cloudConfig.url.replace(/\/$/,'') + '/rest/v1/courier_retention_state';
}
async function cloudLoad({silent=false}={}){
  if(!cloudConfig?.url || !cloudConfig?.anonKey || !cloudConfig?.workspaceId) return;
  try{
    const q = `${cloudBase()}?workspace_id=eq.${encodeURIComponent(cloudConfig.workspaceId)}&select=workspace_id,data,updated_at&limit=1`;
    const res = await fetch(q,{headers:cloudHeaders()});
    if(!res.ok) throw new Error(await res.text());
    const rows=await res.json();
    if(rows.length){
      const row=rows[0];
      const remoteTs = row.updated_at || '';
      if(!cloudRevision || remoteTs > cloudRevision){
        state = row.data;
        ensureV2Data();
        cloudRevision = remoteTs;
        localStorage.setItem('courierRetentionEngineDataV8',JSON.stringify(state));
        dirty=false;
        if(!silent) render();
      }
    }else{
      await cloudSave();
    }
    updateCloudStatus('Облако подключено');
  }catch(e){
    updateCloudStatus('Ошибка синхронизации');
    if(!silent) alert('Не удалось загрузить данные из облака: '+e.message);
  }
}
async function cloudSave(){
  if(!cloudConfig?.url || !cloudConfig?.anonKey || !cloudConfig?.workspaceId) return;
  const body={workspace_id:cloudConfig.workspaceId,data:state,updated_at:new Date().toISOString()};
  try{
    const check=await fetch(`${cloudBase()}?workspace_id=eq.${encodeURIComponent(cloudConfig.workspaceId)}&select=workspace_id&limit=1`,{headers:cloudHeaders()});
    if(!check.ok) throw new Error(await check.text());
    const existing=await check.json();
    let res;
    if(existing.length){
      res=await fetch(`${cloudBase()}?workspace_id=eq.${encodeURIComponent(cloudConfig.workspaceId)}`,{
        method:'PATCH',headers:cloudHeaders(),body:JSON.stringify(body)
      });
    }else{
      res=await fetch(cloudBase(),{method:'POST',headers:cloudHeaders(),body:JSON.stringify(body)});
    }
    if(!res.ok) throw new Error(await res.text());
    cloudRevision=body.updated_at;
    updateCloudStatus('Синхронизировано ✓');
  }catch(e){
    updateCloudStatus('Ошибка облака');
    alert('Локально изменения сохранены, но облачная синхронизация не удалась: '+e.message);
  }
}
function startCloudPolling(){
  if(cloudPollTimer) clearInterval(cloudPollTimer);
  if(cloudConfig) cloudPollTimer=setInterval(()=>cloudLoad({silent:true}),5000);
}
function updateCloudStatus(text){
  const el=document.getElementById('cloud-status');
  if(el) el.textContent=text;
}

  const old=document.getElementById('cloud-setup-root'); if(old) old.remove();
  const el=document.createElement('div'); el.id='cloud-setup-root';
  el.innerHTML=`<div class="cloud-panel">
    <div class="cloud-card">
      <h2>Облачная синхронизация</h2>
      <p>Для общей версии на всех компьютерах подключи один Supabase-проект. Все устройства с одинаковым Workspace ID будут видеть одни и те же данные.</p>
      <label>Supabase Project URL</label>
      <input id="cloud-url" placeholder="https://xxxx.supabase.co" value="${cloudConfig?.url||''}">

      <div class="notice" style="margin-top:14px">В Supabase должна существовать таблица <b>courier_retention_state</b> с колонками workspace_id (text, primary key), data (jsonb), updated_at (timestamptz).</div>
      <div class="top-actions" style="margin-top:18px">
        <button class="btn primary" onclick="connectCloud()">Подключить</button>
        <button class="btn" onclick="document.getElementById('cloud-setup-root').remove()">Закрыть</button>
      </div>
    </div>
  </div>`;
  document.body.appendChild(el);

async function connectCloud(){
  const cfg={
    url:document.getElementById('cloud-url').value.trim(),
    anonKey:document.getElementById('cloud-key').value.trim(),
    workspaceId:document.getElementById('cloud-workspace').value.trim()
  };
  if(!cfg.url||!cfg.anonKey||!cfg.workspaceId){ alert('Заполни все три поля'); return; }
  saveCloudConfig(cfg);
  await cloudLoad();
  startCloudPolling();
  document.getElementById('cloud-setup-root')?.remove();
  render();
}

function load(){
  try{
    const raw = localStorage.getItem('courierRetentionEngineDataV8');
    return raw ? JSON.parse(raw) : structuredClone(DEMO);
  }catch(e){ return structuredClone(DEMO); }
}

function ensureV2Data(){
  const demoRetention = DEMO.stages?.find(s=>s.id==='retention');
  let retention = state.stages?.find(s=>s.id==='retention');
  if(!retention && demoRetention){
    state.stages.push(structuredClone(demoRetention));
    retention = state.stages.find(s=>s.id==='retention');
  }
  if(!retention || !demoRetention) return;

  if(!retention.categories) retention.categories=[];
  demoRetention.categories.forEach((demoCat, catIndex)=>{
    let cat = retention.categories.find(c=>c.id===demoCat.id);
    if(!cat){
      retention.categories.push(structuredClone(demoCat));
      return;
    }
    if(cat.order==null) cat.order=demoCat.order ?? catIndex+1;
    if(!cat.problems) cat.problems=[];
    demoCat.problems.forEach((demoProblem, problemIndex)=>{
      const existing = cat.problems.find(p=>p.id===demoProblem.id);
      if(!existing){
        cat.problems.push(structuredClone(demoProblem));
      }else{
        if(existing.order==null) existing.order=problemIndex+1;
        if(demoProblem.transports && !existing.transports) existing.transports=structuredClone(demoProblem.transports);
        if(!existing.description && demoProblem.description) existing.description=demoProblem.description;
        if(!existing.diagnostic && demoProblem.diagnostic) existing.diagnostic=demoProblem.diagnostic;
        if(existing.monetary==null && demoProblem.monetary!=null) existing.monetary=demoProblem.monetary;
      }
    });
  });
  retention.categories.forEach((c,i)=>{
    if(c.order==null) c.order=i+1;
    (c.problems||[]).forEach((p,j)=>{ if(p.order==null) p.order=j+1; });
  });
}

function exportData(){
  try{
    const payload = {
      version: 7,
      exportedAt: new Date().toISOString(),
      app: 'Courier Lifecycle & Retention Decision Engine',
      data: state
    };
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ts = new Date().toISOString().slice(0,19).replaceAll(':','-');
    a.href = url;
    a.download = `courier_retention_data_${ts}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }catch(e){
    alert('Не удалось экспортировать данные: '+e.message);
  }
}

function importData(event){
  const file = event.target.files?.[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      const imported = parsed?.data?.stages ? parsed.data : parsed;
      if(!imported || !Array.isArray(imported.stages)){
        throw new Error('Файл не похож на экспорт Courier Retention Engine');
      }
      if(!confirm('Импорт заменит текущие локальные данные на этом компьютере. Продолжить?')) return;
      state = imported;
      ensureV2Data();
      localStorage.setItem('courierRetentionEngineDataV8', JSON.stringify(state));
      dirty = false;
      transportFilter = 'all';
      render();
      alert('Данные импортированы и сохранены на этом компьютере.');
    }catch(e){
      alert('Не удалось импортировать файл: '+e.message);
    }finally{
      event.target.value='';
    }
  };
  reader.readAsText(file);
}

function moveProblem(sid,cid,pid,delta){
  const c=state.stages.find(s=>s.id===sid).categories.find(c=>c.id===cid);
  const arr=[...(c.problems||[])].sort((a,b)=>a.order-b.order);
  const idx=arr.findIndex(p=>p.id===pid);
  const next=idx+delta;
  if(idx<0||next<0||next>=arr.length) return;
  [arr[idx],arr[next]]=[arr[next],arr[idx]];
  arr.forEach((p,i)=>p.order=i+1);
  c.problems=arr;
  markDirty();
  render();
}

function dropProblem(event,sid,cid,targetPid){
  event.preventDefault();
  event.currentTarget.classList.remove('drop-target');
  if(!draggedProblemId || draggedProblemId===targetPid) return;
  const c=state.stages.find(s=>s.id===sid).categories.find(c=>c.id===cid);
  const arr=[...(c.problems||[])].sort((a,b)=>a.order-b.order);
  const from=arr.findIndex(p=>p.id===draggedProblemId);
  const to=arr.findIndex(p=>p.id===targetPid);
  if(from<0||to<0) return;
  const [moved]=arr.splice(from,1);
  arr.splice(to,0,moved);
  arr.forEach((p,i)=>p.order=i+1);
  c.problems=arr;
  draggedProblemId=null;
  markDirty();
  render();
}
function dropCategory(event,sid,targetCid){
  event.preventDefault();
  event.currentTarget.classList.remove('drop-target');
  event.stopPropagation();
  if(!draggedCategoryId || draggedCategoryId===targetCid) return;
  const s=state.stages.find(x=>x.id===sid);
  const arr=[...(s.categories||[])].sort((a,b)=>a.order-b.order);
  const from=arr.findIndex(c=>c.id===draggedCategoryId);
  const to=arr.findIndex(c=>c.id===targetCid);
  if(from<0||to<0) return;
  const [moved]=arr.splice(from,1);
  arr.splice(to,0,moved);
  arr.forEach((c,i)=>c.order=i+1);
  s.categories=arr;
  draggedCategoryId=null;
  markDirty();
  render();
}

function onSearch(q){
  const input=q.trim().toLowerCase();
  searchOpen=!!input;
  window.__searchQuery=input;
  render();
  setTimeout(()=>{ const el=document.getElementById('global-search'); if(el){el.value=q; el.focus();}},0);
}
function searchResultsHTML(){
  const q=window.__searchQuery||'';
  if(!q) return '';
  const results=[];
  state.stages.forEach(s=>{
    if((s.name+' '+s.description).toLowerCase().includes(q)) results.push({label:s.name,path:s.name,hash:`#/stage/${s.id}`});
    (s.categories||[]).forEach(c=>{
      if((c.name+' '+(c.description||'')).toLowerCase().includes(q)) results.push({label:c.name,path:`${s.name} → ${c.name}`,hash:`#/stage/${s.id}/category/${c.id}`});
      (c.problems||[]).forEach(p=>{
        const blob=[p.name,p.description,p.lowSolution,p.mediumSolution,p.highSolution,(p.transports||[]).join(' ')].join(' ').toLowerCase();
        if(blob.includes(q)) results.push({label:p.name,path:`${s.name} → ${c.name} → ${p.name}`,hash:`#/stage/${s.id}/category/${c.id}`});
      })
    })
  });
  const show=results.slice(0,8);
  return `<div class="search-results">${show.length?show.map(r=>`<div class="search-item" onclick="searchOpen=false;go('${r.hash}')"><strong>${r.label}</strong><div class="search-path">${r.path}</div></div>`).join(''):`<div class="search-item">Ничего не найдено</div>`}</div>`;
}

function esc(s){ return String(s??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;'); }

window.addEventListener('beforeunload',e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; }});
if(cloudConfig){
  cloudLoad({silent:true}).then(()=>render());
  startCloudPolling();
}else{
  render();
}

</script>
